services:
  app:
    build: .
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports: ["8000:8000"]
    volumes: [".:/var/www"]
    depends_on: [db]
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: support_desk
      DB_USERNAME: sd
      DB_PASSWORD: sd1234
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sd
      POSTGRES_PASSWORD: sd1234
      POSTGRES_DB: support_desk
    volumes: ["sd_data:/var/lib/postgresql/data"]
volumes:
  sd_data:
